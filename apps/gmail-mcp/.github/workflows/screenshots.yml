name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - "src/tui/**"
      - "fixtures/gmail/**"
      - "scripts/screenshots/**"
      - "docs/screenshots/**"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "src/tui/**"
      - "fixtures/gmail/**"
      - "scripts/screenshots/**"
      - "docs/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

jobs:
  check:
    name: Screenshot Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VHS, ttyd, ffmpeg, and JetBrains Mono
        env:
          VHS_VERSION: "0.11.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttyd ffmpeg fonts-jetbrains-mono
          fc-cache -f

      - name: Regenerate screenshots
        run: |
          set -euo pipefail
          pnpm build
          bash scripts/screenshots/prepare-fake-editor.sh
          mkdir -p docs/screenshots
          for tape in scripts/screenshots/*.tape; do
            echo "Rendering $tape"
            vhs "$tape"
          done

      - name: Report screenshot drift
        run: |
          set -euo pipefail
          if git diff --exit-code -- docs/screenshots/; then
            echo "Screenshots are in sync."
          else
            echo "Screenshots differ from the committed baseline."
            echo "VHS image encoders are not byte-deterministic, so reviewers must inspect the artifact."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gmail-mcp-screenshots
          path: docs/screenshots/
          if-no-files-found: error

  commit:
    name: Commit Screenshots
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: gmail-mcp-screenshots
          path: docs/screenshots/

      - name: Commit regenerated screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain -- docs/screenshots/)" ]]; then
            git add docs/screenshots/
            git commit -m "chore(screenshots): regenerate via VHS [skip ci]"
            git push
          else
            echo "No screenshot changes to commit."
          fi
