name: Release

# Runs semantic-release after CI succeeds on main. Publishing uses npm OIDC
# trusted publishing (npmjs.com trust: @george43g/gmail-mcp <-> this repo via
# this workflow) — no NPM_TOKEN secret exists or is needed; `id-token: write`
# lets npm mint a short-lived credential and attach provenance automatically.
# The FIRST publish of the package is done manually; this workflow handles
# subsequent releases driven by conventional commits.

# ⚠ AUTO-RELEASE IS DISABLED during pre-EQ-Stack-merge development: heavy
# changes/testing are still ahead, and the npm trusted-publishing linkage
# (and package.json repository URL, which provenance validates) will move to
# the EQ-Stack repo anyway. Re-enable by restoring the workflow_run trigger
# below. A manual workflow_dispatch still runs a REAL release — only trigger
# it deliberately.
on:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Shared with screenshots.yml's commit job so the two workflows never push
    # to main concurrently (the semantic-release commit would race the
    # screenshot auto-commit otherwise).
    concurrency:
      group: main-mutations
      cancel-in-progress: false
    permissions:
      id-token: write # npm OIDC trusted publishing + provenance
      contents: write # @semantic-release/git commit + tag push
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # @semantic-release/github comments on released PRs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      # NOTE: no `registry-url` here on purpose — setup-node's generated
      # .npmrc conflicts with semantic-release's npm auth and breaks OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles a compatible
      # npm. Logged so a runner-image regression is diagnosable from the run.
      - name: Log toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
