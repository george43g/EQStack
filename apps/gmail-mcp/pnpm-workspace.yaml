packages:
  - .
allowBuilds:
  esbuild: true

overrides:
  "@hono/node-server": 2.0.11
  body-parser: 2.3.0
  # googleapis-common 8.0.2+ exact-pins google-auth-library@10.5.0, which forks
  # the GAL types against our direct ^10.9.0 (two copies -> TS2769 in CI's npm
  # tree). 8.0.1 declares ^10.1.0 and dedupes to a single copy.
  googleapis-common: 8.0.1
  fast-uri: 3.1.5
  hono: 4.13.3
  ip-address: 10.5.0
  qs: 6.15.3
  ws: 8.21.1

# pnpm resolves direct-dep ranges to the LOWEST satisfying version by default
# (lowest-direct). The @george43g kit ranges (">=0.x <1") assume highest —
# without this, 0.10.0+ fixes are published but never installed here.
resolutionMode: highest

# pnpm 11 quarantines freshly-published versions from RANGE resolution by
# default (minimumReleaseAge supply-chain protection; exact specifiers
# bypass it). Good default — but it silently defeats the shared-kit
# "publish a fix, consumer installs it immediately" workflow. Exempt our
# own scope only; everything else stays quarantined.
minimumReleaseAgeExclude:
  - "@george43g/*"
