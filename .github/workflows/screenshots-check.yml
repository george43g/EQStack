name: screenshots-check

on:
  pull_request:
    paths:
      - 'apps/imsg-mcp/src/tui/**'
      - 'apps/imsg-mcp/scripts/screenshots/*.tape'
      - 'apps/imsg-mcp/docs/screenshots/**'
      - '.github/workflows/screenshots-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    # vhs + font rendering is non-deterministic at the byte level — running
    # `pnpm screenshots:check` twice in a row on the same machine produces
    # drift in the resulting PNGs. The check is useful as a "did the TUI
    # surface change?" signal, but cannot be a hard gate without a tolerant
    # image-diff (pixelmatch / ImageMagick `compare -metric AE`). The drift
    # step is therefore REPORT-ONLY (warning annotation + file list, exit 0):
    # job-level continue-on-error alone still painted a red X on the PR
    # checks list even though the workflow run succeeded. continue-on-error
    # stays to absorb infra flakiness (brew/vhs/font installs). Track a
    # follow-up: replace byte-equality with a threshold-based pixel diff.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install JetBrains Mono
        run: |
          brew tap homebrew/cask-fonts || true
          brew install --cask font-jetbrains-mono
          fc-cache -f

      - name: Install vhs
        run: brew install vhs

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Regenerate fixtures (test mode)
        run: pnpm fixtures

      - name: Debug TUI boot (canary only — dumps pty capture + NDJSON)
        working-directory: apps/imsg-mcp
        run: |
          mkdir -p /tmp/imsg-demo
          (HOME=/tmp/imsg-demo IMSG_TUI_THEME=safe script -q /tmp/tuiboot.log node --env-file=.env.test dist/cli.js tui &) || true
          sleep 12
          pkill -f 'dist/cli.js tui' || true
          sleep 1
          echo "--- pty capture (first 4KB, control chars visible) ---"
          head -c 4000 /tmp/tuiboot.log | cat -v || true
          echo ""
          echo "--- NDJSON log tail ---"
          ls "$TMPDIR"/imsg-mcp/ 2>/dev/null || echo "(no log dir)"
          for f in "$TMPDIR"/imsg-mcp/*.ndjson; do echo "== $f =="; tail -50 "$f"; done 2>/dev/null || true

      - name: Regenerate screenshots
        run: pnpm screenshots

      - name: Dump TUI NDJSON logs from vhs runs (canary only)
        if: always()
        run: |
          echo "--- log dir ---"
          ls -la "$TMPDIR"/imsg-mcp/ 2>/dev/null || echo "(no log dir)"
          for f in "$TMPDIR"/imsg-mcp/*.ndjson; do echo "== $f =="; tail -30 "$f"; done 2>/dev/null || true

      - name: Report drift (informational)
        run: |
          if ! git diff --quiet -- apps/imsg-mcp/docs/screenshots/; then
            echo "::warning::Screenshots drifted from source (byte-level; often vhs render noise). If the TUI surface changed intentionally, run 'pnpm screenshots' locally and commit the result."
            echo ""
            echo "Drifted files:"
            git diff --name-only -- apps/imsg-mcp/docs/screenshots/
          else
            echo "✓ screenshots match source"
          fi
