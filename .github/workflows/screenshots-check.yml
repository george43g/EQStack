name: screenshots-check

on:
  pull_request:
    paths:
      - 'apps/imsg-mcp/src/tui/**'
      - 'apps/imsg-mcp/scripts/screenshots/*.tape'
      - 'apps/imsg-mcp/docs/screenshots/**'
      - '.github/workflows/screenshots-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    # Two-tier gate:
    #  - Tape EXECUTION is a HARD gate. It is deterministic — the historic
    #    "flakiness" was ink's CI mode (GH exports CI=true → ink suppresses
    #    interactive rendering → every TUI tape timed out on a blank ttyd
    #    screen), double-masked by the screenshots for-loop only propagating
    #    the LAST tape's exit code and by job-level continue-on-error turning
    #    every failure into a run-level "success". Tapes now defeat is-in-ci
    #    with CI=false, the loop fails fast, and this job fails honestly.
    #  - PNG byte DRIFT stays REPORT-ONLY (warning + file list, exit 0): vhs
    #    font rendering is non-deterministic at the byte level. Follow-up
    #    idea: threshold-based pixel diff (pixelmatch / compare -metric AE).
    # Infra flakiness absorption lives on the brew steps' continue-on-error,
    # NOT the job — a job that cannot fail is not a check.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install JetBrains Mono
        continue-on-error: true
        run: |
          brew tap homebrew/cask-fonts || true
          brew install --cask font-jetbrains-mono
          fc-cache -f

      - name: Install vhs
        run: brew install vhs

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Regenerate fixtures (test mode)
        run: pnpm fixtures

      - name: Regenerate screenshots
        run: pnpm screenshots

      - name: Report drift (informational)
        run: |
          if ! git diff --quiet -- apps/imsg-mcp/docs/screenshots/; then
            echo "::warning::Screenshots drifted from source (byte-level; often vhs render noise). If the TUI surface changed intentionally, run 'pnpm screenshots' locally and commit the result."
            echo ""
            echo "Drifted files:"
            git diff --name-only -- apps/imsg-mcp/docs/screenshots/
          else
            echo "✓ screenshots match source"
          fi
